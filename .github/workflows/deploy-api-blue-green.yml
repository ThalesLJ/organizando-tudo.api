name: Deploy API Blue Green

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy-api:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    env:
      DEPLOY_BASE_DIR: ${{ vars.API_DEPLOY_BASE_DIR }}
      API_ENV_FILE: ${{ vars.API_ENV_FILE }}
      API_BLUE_PORT: ${{ vars.API_BLUE_PORT }}
      API_GREEN_PORT: ${{ vars.API_GREEN_PORT }}
      API_APACHE_PROXY_FILE: ${{ vars.API_APACHE_PROXY_FILE }}
      API_APACHE_RELOAD_COMMAND: ${{ vars.API_APACHE_RELOAD_COMMAND }}
      API_APACHE_PROXY_PATH: ${{ vars.API_APACHE_PROXY_PATH }}
      API_DEPLOY_SCRIPT_PATH: ${{ vars.API_DEPLOY_SCRIPT_PATH }}
      API_HEALTHCHECK_PATH: /api/health
      API_HEALTHCHECK_RETRIES: 30
      API_HEALTHCHECK_SLEEP_SECONDS: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy Blue Green API
        run: |
          chmod +x "$API_DEPLOY_SCRIPT_PATH"
          "$API_DEPLOY_SCRIPT_PATH" "$GITHUB_SHA" "$GITHUB_WORKSPACE"
