name: Deploy API

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy-api:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    env:
      DEPLOY_BASE_DIR: ${{ vars.API_DEPLOY_BASE_DIR }}
      API_ENV_FILE: ${{ vars.API_ENV_FILE }}
      API_PM2_APP_NAME: ${{ vars.API_PM2_APP_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy API Single Version
        run: |
          set -euo pipefail

          if [[ -z "${DEPLOY_BASE_DIR:-}" ]]; then
            echo "API_DEPLOY_BASE_DIR is required"
            exit 1
          fi

          if [[ -z "${API_ENV_FILE:-}" || ! -f "$API_ENV_FILE" ]]; then
            echo "API_ENV_FILE is required and must exist"
            exit 1
          fi

          if [[ -z "${API_PM2_APP_NAME:-}" ]]; then
            echo "API_PM2_APP_NAME is required"
            exit 1
          fi

          if ! command -v pm2 >/dev/null 2>&1; then
            echo "pm2 is required on runner host"
            exit 1
          fi

          deploy_dir="$DEPLOY_BASE_DIR/current"
          logs_dir="$DEPLOY_BASE_DIR/logs"
          log_file="$logs_dir/${API_PM2_APP_NAME}.log"

          mkdir -p "$deploy_dir" "$logs_dir"

          rsync -a --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "node_modules" \
            --exclude "dist" \
            "$GITHUB_WORKSPACE/" "$deploy_dir/"

          cp "$API_ENV_FILE" "$deploy_dir/.env"

          api_port="$(awk -F= '/^PORT=/{print $2}' "$deploy_dir/.env" | tail -n 1 | tr -d '\r' | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")"
          if [[ -z "$api_port" ]]; then
            echo "PORT is required in API_ENV_FILE"
            exit 1
          fi

          pushd "$deploy_dir" >/dev/null
          npm ci
          npm run build
          popd >/dev/null

          entrypoint="dist/main.js"
          if [[ ! -f "$deploy_dir/$entrypoint" && -f "$deploy_dir/dist/src/main.js" ]]; then
            entrypoint="dist/src/main.js"
          fi

          if [[ ! -f "$deploy_dir/$entrypoint" ]]; then
            echo "main entrypoint not found in dist"
            ls -la "$deploy_dir/dist" || true
            exit 1
          fi

          pm2 delete "$API_PM2_APP_NAME" >/dev/null 2>&1 || true

          pushd "$deploy_dir" >/dev/null
          PORT="$api_port" pm2 start "$entrypoint" --name "$API_PM2_APP_NAME" --time --output "$log_file" --error "$log_file"
          pm2 save
          popd >/dev/null

          if ! pm2 describe "$API_PM2_APP_NAME" >/dev/null 2>&1; then
            echo "pm2 process was not started"
            exit 1
          fi

          echo "deploy finished on port $api_port"

  validate-api-public-health:
    runs-on: ubuntu-latest
    needs: deploy-api
    steps:
      - name: Validate API public health endpoint
        run: |
          set -euo pipefail
          health_url="https://organizandotudo.api.thaleslj.com/api/health"
          response="$(curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "$health_url")"
          if [[ "$response" != *'"status":"ok"'* ]]; then
            echo "Unexpected health response: $response"
            exit 1
          fi
